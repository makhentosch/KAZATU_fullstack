<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка разработчика</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Искандер Махамбет</h1>
    <button id="themeBtn">🌙 Тёмная тема</button>
  </header>

  <main>
    <section class="about">
      <h2>Обо мне</h2>
      <img src="https://picsum.photos/200/200" alt="Фото">
      <p>Я студент, изучаю full-stack разработку. Сейчас осваиваю HTML, CSS и JavaScript.</p>
      <p><a href="https://github.com/makhentosch" target="_blank">Мой GitHub</a></p>


      <div class="greet-form">
        <input type="text" id="nameInput" placeholder="Введите ваше имя">
        <button id="greetBtn">Поздороваться</button>
      </div>
      <p id="greeting"></p>
    </section>

    <section>
      <h2>Навыки</h2>
      <div class="cards">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
